<!DOCTYPE html>
<html lang="pt-br" class="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{% block title %}{% endblock %}</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <style>
    [x-cloak] { display: none !important; }
  </style>
</head>

<body class="min-h-screen bg-linear-to-br from-slate-950 via-indigo-950 to-slate-900 text-slate-100 antialiased">
  <div class="relative flex min-h-screen flex-col" x-data="{ sidebarOpen: false }">
    <!-- Decorative background glow, purely cosmetic -->
    <div class="pointer-events-none fixed -top-32 -left-24 h-72 w-72 rounded-full bg-indigo-600/20 blur-3xl sm:h-96 sm:w-96" aria-hidden="true"></div>
    <div class="pointer-events-none fixed -right-24 -bottom-32 h-72 w-72 rounded-full bg-violet-600/20 blur-3xl sm:h-96 sm:w-96" aria-hidden="true"></div>

    {% include 'components/_header.html' %}

    <div class="relative flex flex-1 pt-16">
      {% if user.is_authenticated %}
        {% include 'components/_sidebar.html' %}
      {% endif %}

      <div class="min-w-0 flex-1">
        <main class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
          {% block content %}
          {% endblock %}
        </main>
      </div>
    </div>

    {% include 'components/_footer.html' %}
  </div>
</body>

</html>
