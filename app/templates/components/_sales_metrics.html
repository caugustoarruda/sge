<div class="mt-6">
  <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">
    <div class="rounded-2xl border border-white/10 bg-white/5 p-5 shadow-2xl shadow-black/40 backdrop-blur-xl transition hover:border-indigo-500/30">
      <div class="flex items-center gap-3">
        <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-indigo-500/15 text-indigo-400">
          <i class="bi bi-cart-check text-lg" aria-hidden="true"></i>
        </span>
        <p class="text-sm font-medium text-slate-400">Quantidade de vendas</p>
      </div>
      <p class="mt-3 text-2xl font-semibold text-white sm:text-3xl">{{ sales_metrics.total_sales }}</p>
    </div>

    <div class="rounded-2xl border border-white/10 bg-white/5 p-5 shadow-2xl shadow-black/40 backdrop-blur-xl transition hover:border-violet-500/30">
      <div class="flex items-center gap-3">
        <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-violet-500/15 text-violet-400">
          <i class="bi bi-boxes text-lg" aria-hidden="true"></i>
        </span>
        <p class="text-sm font-medium text-slate-400">Produtos vendidos</p>
      </div>
      <p class="mt-3 text-2xl font-semibold text-white sm:text-3xl">{{ sales_metrics.total_products_solds }}</p>
    </div>

    <div class="rounded-2xl border border-white/10 bg-white/5 p-5 shadow-2xl shadow-black/40 backdrop-blur-xl transition hover:border-emerald-500/30">

          <i class="bi bi-cash-coin text-lg" aria-hidden="true"></i>
        </span>
        <p class="text-sm font-medium text-slate-400">Valor das vendas</p>
      </div>
      <p class="mt-3 text-2xl font-semibold text-white sm:text-3xl">R$ {{ sales_metrics.total_sales_value }}</p>
    </div>

    <div class="rounded-2xl border border-white/10 bg-white/5 p-5 shadow-2xl shadow-black/40 backdrop-blur-xl transition hover:border-amber-500/30">

          <i class="bi bi-graph-up-arrow text-lg" aria-hidden="true"></i>
        </span>
        <p class="text-sm font-medium text-slate-400">Lucro das vendas</p>
      </div>
      <p class="mt-3 text-2xl font-semibold text-white sm:text-3xl">R$ {{ sales_metrics.total_sales_profit }}</p>
