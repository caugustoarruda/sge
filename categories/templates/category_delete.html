{% extends 'base.html' %}

{% block title %}
    SGE - Excluir Categoria
{% endblock %}
{% block content %}
  <div class="mx-auto max-w-lg">
    <div class="mb-6">
      <h1 class="text-xl font-semibold tracking-tight text-white sm:text-2xl">Excluir Categoria</h1>
    </div>

    <div class="rounded-2xl border border-white/10 bg-white/5 p-5 shadow-2xl shadow-black/40 backdrop-blur-xl sm:p-6">
      <p class="text-sm text-slate-300">
        Tem certeza que deseja excluir a categoria <strong class="font-semibold text-white">{{ object.name }}</strong>? Esta ação não pode ser desfeita.
      </p>

      <form method="post" class="mt-6 flex flex-col-reverse gap-3 sm:flex-row sm:justify-end">
        {% csrf_token %}
        <a
          href="{% url 'category_list' %}"
          class="rounded-lg border border-white/10 bg-white/5 px-4 py-2.5 text-center text-sm font-medium text-slate-200 transition hover:bg-white/10"
        >
          Cancelar e voltar
        </a>
        <button
          type="submit"
          class="rounded-lg bg-linear-to-r from-red-600 to-rose-600 px-4 py-2.5 text-sm font-semibold text-white shadow-lg shadow-red-950/50 transition hover:from-red-500 hover:to-rose-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-red-400 focus-visible:ring-offset-2 focus-visible:ring-offset-slate-950 active:scale-[0.99]"
        >
          Excluir
        </button>
      </form>
    </div>
  </div>
{% endblock %}
